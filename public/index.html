<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Activity Generator</h1>
      <p class="subtitle">Generate random activities and save them to your database.</p>

      <section class="actions">
        <button id="generate-btn">Generate & Save Activity</button>
        <button id="refresh-btn" class="secondary">Refresh List</button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>

      <section class="results">
        <h2>Saved Activities (<span id="count">0</span>)</h2>
        <ul id="activities-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
