<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Activity Tracker</h1>
      <p class="subtitle">Type an activity and save it to your database.</p>

      <section class="actions">
        <input id="activity-input" type="text" placeholder="e.g. Read 10 pages" maxlength="255" />
        <button id="save-btn">Save Activity</button>
        <button id="refresh-btn" class="secondary">Refresh List</button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>

      <section class="results">
        <h2>Saved Activities (<span id="count">0</span>)</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Activity</th>
            </tr>
          </thead>
          <tbody id="activities-body"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
